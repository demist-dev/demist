[project]
name = "demist"
version = "0.9.0"
description = "DEcomposition of MIxed Signals for millimeter/submillimeter Telescopes"
readme = "README.md"
keywords = [
    "astronomy",
    "demist",
    "millimeter",
    "nro-45m",
    "python",
    "radio-astronomy",
    "single-dish",
    "submillimeter",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fire>=0.7,<1.0",
    "matplotlib>=3",
    "ndtools>=1",
    "numpy>=2",
    "pandas>=2",
    "sam45>=1",
    "scikit-learn>=1",
    "scipy>=1",
    "tqdm>=4",
    "xarray>=2025",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[[project.authors]]
name = "Akio Taniguchi"
email = "mail@taniguchiak.io"

[project.license]
file = "LICENSE"

[project.scripts]
demist = "demist:cli"

[project.urls]
homepage = "https://demist-dev.github.io/demist"
repository = "https://github.com/demist-dev/demist"

[dependency-groups]
dev = [
    "black>=26",
    "ipython>=8",
    "myst-parser>=4",
    "pandas-stubs>=2",
    "pydata-sphinx-theme>=0.19",
    "pyright>=1",
    "pytest>=9",
    "sphinx>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"
